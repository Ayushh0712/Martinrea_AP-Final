# Martinrea AP — production stack for the netlink-dev VM (80.225.204.210).
#
# Run from the PROJECT ROOT on the VM:
#   docker compose -f deploy/prod/docker-compose.prod.yml up -d --build
#
# Public surface: ONLY caddy publishes a port (80). Everything else talks over
# the internal Docker network by service name.
#
# This stack REUSES two services already running on the VM host (NOT started
# here): the existing Postgres "appdb" (:8082) and the existing Keycloak (:8081).
# The workflow + ingestion containers reach them via host.docker.internal
# (see extra_hosts below); those host services must listen on 0.0.0.0 and allow
# the Docker bridge subnet. See deploy/DEPLOY.md for the full runbook.

name: martinrea-ap-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - workflow
      - ingestion

  frontend:
    build:
      context: ../../frontend
      args:
        # Inlined into the client bundle at build time so the browser calls
        # same-origin /api (Caddy routes it). Must be a build arg, not runtime.
        NEXT_PUBLIC_API_BASE_URL: /api
    image: martinrea-ap/frontend
    restart: unless-stopped
    environment:
      # Runtime fallbacks for next.config.ts rewrites; Caddy normally routes
      # /api/* before Next sees it.
      API_PROXY_TARGET: http://workflow:3001
      INGESTION_PROXY_TARGET: http://ingestion:3002

  workflow:
    build:
      context: ../../backend/workflow
    image: martinrea-ap/workflow-service
    restart: unless-stopped
    env_file:
      - ./workflow.env
    volumes:
      # OCR upload scratch space (UPLOAD_DIR=./uploads -> /app/uploads).
      - workflow_uploads:/app/uploads
      # PO drop folders: drop files on the VM host under the project root,
      # exactly like the local dev flow (PO-PDFs/ -> OCI, PO-Data/ -> DB).
      - ../../PO-PDFs:/data/po-pdfs
      - ../../PO-Data:/data/po-data
    # Reach the host's appdb Postgres (:8082) and Keycloak (:8081).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started

  ingestion:
    build:
      context: ../../backend/ingestion
    image: martinrea-ap/ingestion
    restart: unless-stopped
    env_file:
      - ./ingestion.env
    # Reach the host's Keycloak (:8081) for token verification.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - martinrea_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  workflow_uploads:
  martinrea_redis_data:
