name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Build + test gate for all three backend services (PRD 6.2 quality gate).
jobs:
  build-test:
    name: build-test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - "backend/workflow"
          - "backend/ingestion"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build

      - name: Unit tests
        working-directory: ${{ matrix.service }}
        run: npm test --if-present
